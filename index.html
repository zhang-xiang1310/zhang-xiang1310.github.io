<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10110f" />
    <title>Personal Intro</title>
    <meta
      name="description"
      content="A private personal introduction site with authenticated uploads."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="siteHeader">
      <a class="brandMark" href="#top" aria-label="回到顶部">ZX</a>
      <nav class="mainNav" aria-label="页面导航">
        <a href="#intro">Intro</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="authButton" id="authButton" type="button" aria-label="登录">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15 3a3 3 0 0 1 3 3v2h-2V6a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-2h2v2a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h7Z"
            fill="currentColor"
          />
          <path
            d="M13.7 8.3 17.4 12l-3.7 3.7-1.4-1.4 1.3-1.3H6v-2h7.6l-1.3-1.3 1.4-1.4Z"
            fill="currentColor"
          />
        </svg>
        <span id="authLabel">登录</span>
      </button>
    </header>

    <main id="top">
      <section class="heroSection" aria-labelledby="hero-title">
        <button
          class="heroMedia uploadZone"
          id="slot-hero"
          type="button"
          data-slot="hero"
          aria-label="封面影像"
          disabled
        >
          <img
            id="image-hero"
            src="/assets/hero-bg.png"
            alt="封面影像"
            draggable="false"
          />
          <span class="uploadOverlay hidden" data-overlay>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                fill="currentColor"
              />
            </svg>
            <span data-overlay-text>上传</span>
          </span>
        </button>
        <div class="heroVeil" aria-hidden="true"></div>
        <div class="heroContent">
          <p class="eyebrow" id="stateLabel">PRIVATE PORTFOLIO / 2026</p>
          <h1 id="hero-title">
            <span>YOUR NAME</span>
            <span>PERSONAL SITE</span>
          </h1>
          <div class="heroGrid" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <section id="intro" class="introSection">
        <div class="sectionShell introShell">
          <div class="sectionLabel">
            <span>01</span>
            <strong>INTRODUCTION</strong>
          </div>
          <button
            class="portraitFrame uploadZone"
            id="slot-portrait"
            type="button"
            data-slot="portrait"
            aria-label="肖像区域"
            disabled
          >
            <img
              id="image-portrait"
              src="/assets/portrait-placeholder.png"
              alt="肖像区域"
            />
            <span class="uploadOverlay hidden" data-overlay>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                  fill="currentColor"
                />
              </svg>
              <span data-overlay-text>上传</span>
            </span>
          </button>
          <div class="introCopy">
            <h2>PROFILE</h2>
            <div class="skeletonCopy" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </section>

      <section id="work" class="workSection">
        <div class="sectionShell">
          <div class="sectionLabel">
            <span>02</span>
            <strong>SELECTED WORK</strong>
          </div>
          <div class="workGrid">
            <article class="workCard">
              <button
                class="workImage uploadZone"
                id="slot-work-one"
                type="button"
                data-slot="work-one"
                aria-label="作品一"
                disabled
              >
                <img
                  id="image-work-one"
                  src="/assets/work-one.png"
                  alt="作品一"
                />
                <span class="workNumber">01</span>
                <span class="uploadOverlay hidden" data-overlay>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                      fill="currentColor"
                    />
                  </svg>
                  <span data-overlay-text>上传</span>
                </span>
              </button>
              <div class="workMeta">
                <span>PROJECT 01</span>
                <div class="skeletonCopy" aria-hidden="true">
                  <span></span>
                  <span></span>
                </div>
              </div>
            </article>

            <article class="workCard">
              <button
                class="workImage uploadZone"
                id="slot-work-two"
                type="button"
                data-slot="work-two"
                aria-label="作品二"
                disabled
              >
                <img
                  id="image-work-two"
                  src="/assets/work-two.png"
                  alt="作品二"
                />
                <span class="workNumber">02</span>
                <span class="uploadOverlay hidden" data-overlay>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                      fill="currentColor"
                    />
                  </svg>
                  <span data-overlay-text>上传</span>
                </span>
              </button>
              <div class="workMeta">
                <span>PROJECT 02</span>
                <div class="skeletonCopy" aria-hidden="true">
                  <span></span>
                  <span></span>
                </div>
              </div>
            </article>

            <article class="workCard">
              <button
                class="workImage uploadZone"
                id="slot-work-three"
                type="button"
                data-slot="work-three"
                aria-label="作品三"
                disabled
              >
                <img
                  id="image-work-three"
                  src="/assets/work-three.png"
                  alt="作品三"
                />
                <span class="workNumber">03</span>
                <span class="uploadOverlay hidden" data-overlay>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                      fill="currentColor"
                    />
                  </svg>
                  <span data-overlay-text>上传</span>
                </span>
              </button>
              <div class="workMeta">
                <span>PROJECT 03</span>
                <div class="skeletonCopy" aria-hidden="true">
                  <span></span>
                  <span></span>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section id="contact" class="contactSection">
        <div class="sectionShell contactShell">
          <div class="sectionLabel">
            <span>03</span>
            <strong>CONTACT</strong>
          </div>
          <button
            class="markFrame uploadZone"
            id="slot-mark"
            type="button"
            data-slot="mark"
            aria-label="签名标识"
            disabled
          >
            <img
              id="image-mark"
              src="/assets/mark-placeholder.png"
              alt="签名标识"
            />
            <svg class="markIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 12.5 10.5 7l1.4 1.4-4.1 4.1H19v2H7.8l4.1 4.1-1.4 1.4L5 12.5Z"
                fill="currentColor"
              />
            </svg>
            <span class="uploadOverlay hidden" data-overlay>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 4 8 8h3v6h2V8h3l-4-4Zm-7 11h2v3h12v-3h2v5H5v-5Z"
                  fill="currentColor"
                />
              </svg>
              <span data-overlay-text>上传</span>
            </span>
          </button>
          <div class="contactCopy">
            <h2>CONNECT</h2>
            <div class="skeletonCopy" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="siteFooter">
      <span>PERSONAL INTRO</span>
      <span>PRIVATE EDITION</span>
    </footer>

    <input
      id="fileInput"
      class="hiddenInput"
      type="file"
      accept="image/*"
    />

    <div class="modalBackdrop hidden" id="loginModal" aria-hidden="true">
      <form class="loginPanel" id="loginForm">
        <button class="closeButton" type="button" id="closeLogin" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5Z" fill="currentColor" />
          </svg>
        </button>
        <div class="loginIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2a7 7 0 0 0-7 7v3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2V9a7 7 0 0 0-7-7Zm-5 10V9a5 5 0 0 1 10 0v3H7Z"
              fill="currentColor"
            />
          </svg>
        </div>
        <h2>Admin Access</h2>
        <label>
          <span>账号</span>
          <input
            id="emailInput"
            name="email"
            type="email"
            placeholder="1403608175@qq.com"
            autocomplete="username"
            required
          />
        </label>
        <label>
          <span>密码</span>
          <input
            id="passwordInput"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <p class="formError hidden" id="loginError">账号或密码不正确</p>
        <button class="primaryButton" type="submit" id="loginSubmit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13 3a3 3 0 0 1 3 3v2h-2V6a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-2h2v2a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h5Z"
              fill="currentColor"
            />
            <path d="M16 8.5 20.5 13 16 17.5 14.6 16.1 16.7 14H9v-2h7.7l-2.1-2.1L16 8.5Z" fill="currentColor" />
          </svg>
          <span id="loginButtonLabel">进入</span>
        </button>
      </form>
    </div>

    <div class="toast hidden" id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
